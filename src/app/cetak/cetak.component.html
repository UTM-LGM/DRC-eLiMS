<div class="card">
    <h4 class="card-header">Pengesahan Cetakan keputusan</h4>
    <div class="card-body">
        <p class="card-text"><b><i>**Sila pastikan pengesahan cetakan keputusan dibuat selepas mencetak keputusan.</i></b></p>
        <p class="card-text">Adakah keputusan telah berjaya dicetak?</p>

        <span>
            <button type="submit" class="btn btn-primary btn-block" (click)="onYesClick()">Ya</button>
            <span style="margin-right: 10px;"></span><!-- This creates space -->
            <button type="submit" class="btn btn-danger btn-block" (click)="onNoClick()">Tidak</button>
        </span>

        <br><br>
        <label style="color:red;" *ngIf="mesYaTidak=='yes'">Pengesahan Cetakan Keputusan: 'YA' telah berjaya direkodkan</label>
        <label style="color:red;" *ngIf="mesYaTidak=='tidak'">Pengesahan Cetakan Keputusan: 'TIDAK' telah berjaya direkodkan</label>
    </div>
</div>

<hr>

<div *ngIf="creatorRoleId == 1">
    <app-pdf-cetak-keputusan [k1DetailId]="listk1DetailId"></app-pdf-cetak-keputusan>
</div>

<div *ngIf="creatorRoleId == 2">
    <app-pdf-cetak-keputusan-uip [k1DetailId]="listk1DetailId"></app-pdf-cetak-keputusan-uip>
</div>
