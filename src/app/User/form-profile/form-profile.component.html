<div class="container mb-3">
    <mat-card class="shadow p-3 mb-5 ml-0 pl-1 bg-white rounded">
        <mat-card-content>
            <h1 class="attractive-title">Profil</h1>

            <form #form="ngForm" (ngSubmit)="updateProfile()">

                <div *ngIf="roleForwarder" class="mat-card-container">

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Nama pengguna</label><br>
                            <label class="label_bi">Name</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="username" name="username"
                                [(ngModel)]="user.username" disabled>
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Syarikat Penghantar<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Agent forwarder</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="name" name="name" [(ngModel)]="forwarder.name"
                                readonly>
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Alamat<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Address</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="address" name="address"
                                [(ngModel)]="forwarder.address">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Poskod<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Postcode</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="postcode" name="postcode"
                                [(ngModel)]="forwarder.postcode">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Faks<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Fax</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="fax" name="fax" [(ngModel)]="forwarder.fax">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">No. Telefon<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Telephone No.</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="tel" name="tel" [(ngModel)]="forwarder.tel">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Orang yang boleh Dihubungi<span class="required"
                                    style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Contact Person</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="contactPerson" name="contactPerson"
                                [(ngModel)]="forwarder.contactPerson">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">E-mel<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Email</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="email" name="email"
                                [(ngModel)]="forwarder.email">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Kod Agent<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Agent Code</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="code" name="code"
                                [(ngModel)]="forwarder.code">
                        </div>
                    </div><br>


                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">No Lesen<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">License No</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="licenseNo" name="licenseNo"
                                [(ngModel)]="forwarder.licenseNo">
                        </div>
                    </div><br>


                </div>



                <div *ngIf="roleImporter" class="mat-card-container">

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Nama pengguna</label><br>
                            <label class="label_bi">Name</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="username" name="username"
                                [(ngModel)]="importer.username" disabled>
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Syarikat Pengimport<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Importer Company</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="name" name="name" [(ngModel)]="importer.name"
                                readonly>
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Alamat<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Address</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="address" name="address"
                                [(ngModel)]="importer.address">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Poskod<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Postcode</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="postcode" name="postcode"
                                [(ngModel)]="importer.postcode">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Faks<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Fax</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="fax" name="fax" [(ngModel)]="importer.fax">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">No. Telefon<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Telephone No.</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="tel" name="tel" [(ngModel)]="importer.tel">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Orang yang boleh Dihubungi<span class="required"
                                    style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Contact Person</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="contactPerson" name="contactPerson"
                                [(ngModel)]="importer.contactPerson">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">E-mel<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Email</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="email" name="email"
                                [(ngModel)]="importer.email">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Kod Pengimport<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Importer Code</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="SmkimportersCode" name="SmkimportersCode"
                                [(ngModel)]="importer.smkimportersCode">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">No Lesen<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">License No</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="licenseNo" name="licenseNo"
                                [(ngModel)]="importer.licenseNo">
                        </div>
                    </div><br>


                </div>

                <div *ngIf="roleUip" class="mat-card-container">

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Nama Penuh<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Name</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="staffName" name="staffName"
                                [(ngModel)]="staff.staffName">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Nama Pengguna</label><br>
                            <label class="label_bi">Username</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="username" name="username"
                                [(ngModel)]="staff.username" disabled="">
                        </div>
                    </div><br>


                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Jawatan<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Position</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="position" name="position"
                                [(ngModel)]="staff.position">
                        </div>
                    </div><br>

                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Pejabat<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Office</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="pejabat" name="pejabat"
                                [(ngModel)]="staff.office">
                        </div>
                    </div><br>


                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">Emel LGM<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">LGM Email</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="emailLgm" name="emailLgm"
                                [(ngModel)]="staff.emailLgm">
                        </div>
                    </div><br>


                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_title">No. tel<span class="required" style="color:red;">
                                    *
                                </span></label><br>
                            <label class="label_bi">Tel. No.</label>
                        </div>
                        <div class="col-sm-6">
                            <input type="text" class="form-control" id="hpNo" name="hpNo" [(ngModel)]="staff.hpNo">
                        </div>
                    </div><br>

                    
                    <div class="row form-group">
                        <div class="col-sm-3">
                            <label class="label_bm">Unit</label><br>
                            <label class="label_bi">Unit</label>
                        </div>
                        <div class="col-sm-6">
                            <select class="form-control" name="unit" id="unit" [(ngModel)]="staff.unit" required
                                disabled>
                                <option value="" disabled selected>--Pilih--</option>
                                <option *ngFor="let unit of unitList" [value]="unit">{{unit}}
                                </option>
                            </select>
                        </div><br>
                    </div><br>

                    <div *ngIf="user" class="mat-card-container">
                        <div class="row form-group">
                            <div class="col-sm-3">
                                <label class="label_title">Nama Pengguna<span class="required" style="color:red;">
                                        *
                                    </span></label><br>
                                <label class="label_bi">Username</label>
                            </div>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="username" name="username"
                                    [(ngModel)]="user.username">
                            </div>
                        </div><br>
                    </div>

                </div>
                <div>
                    <div mat-dialog-actions align="end">
                        <!-- <label for="errorMes" *ngIf="errorMes" style="color: red;">Sila isi semua
                    maklumat</label><br> -->

                    </div>
                </div>

        </mat-card-content>
    </mat-card>
</div>
