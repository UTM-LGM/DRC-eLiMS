<div class="container mb-3">
  <mat-card class="shadow p-3 mb-5 ml-0 pl-1 bg-white rounded">
    <mat-card-content>

<!-- <div class="container"> -->
  <h2 style="text-align: center;">Senarai Notis</h2>

  <div *ngIf="notisList.length > 0">
  <p>Sila pilih notis yang ingin dipaparkan di dashboard pengguna.</p>
  <button mat-icon-button class="add-button" (click)="navigateToShowNotice()">
    <i class="fa-solid fa-square-plus" style="color: #15b300;"></i>
  </button>
</div>

  <form (ngSubmit)="onSubmit()">
    <div *ngFor="let notice of notisList" class="notice-card">
      <mat-card>
        <mat-card-content>
          <button mat-icon-button class="delete-button" (click)="onDelete(notice)">
            <mat-icon>delete</mat-icon>
          </button>
          <!-- <button mat-icon-button class="edit-button" (click)="onEdit(notice)">
            <mat-icon>edit</mat-icon>
          </button> -->

          <mat-checkbox [(ngModel)]="notice.isShow" [ngModelOptions]="{standalone: true}"
            (change)="onCheckboxChange(notice)"><h3>{{ notice.title }}</h3>
          </mat-checkbox>

          
          <p *ngIf="notice.isShow">{{ notice.message }}</p>

        </mat-card-content>
      </mat-card>
    </div>
    <button type="submit" *ngIf="notisList.length > 0" class="btn btn-primary">Papar</button>
  </form>
<!-- </div> -->

    </mat-card-content>
  </mat-card>
</div>
