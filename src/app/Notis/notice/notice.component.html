<div class="container mb-3">
  <mat-card class="shadow p-3 mb-5 ml-0 pl-1 bg-white rounded">
    <mat-card-content>


<!-- <div class="container"> -->
    <h2 style="text-align: center;">Tambah Notis </h2>
    <form [formGroup]="notisForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="title">Tajuk</label>
        <input type="text"id="title"formControlName="title" class="form-control" placeholder="Tajuk"/>
      </div>
  
      <div class="form-group">
        <label for="message">Mesej</label>
        <textarea id="message" formControlName="message" class="form-control" placeholder="Mesej"></textarea>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="notisForm.invalid">
        Hantar
      </button>
    </form>

  <!-- </div> -->
  

    </mat-card-content>

  </mat-card>
</div>
