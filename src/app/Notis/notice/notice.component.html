<div class="container mb-3">
  <mat-card class="shadow p-3 mb-5 ml-0 pl-1 bg-white rounded">
    <mat-card-content>
      <h2 style="text-align: center;">Pengumuman</h2>
      <form #noticeForm="ngForm" (ngSubmit)="onSubmit(noticeForm)">

        <div class="form-group">
          <label for="title">Tajuk <span class="required" style="color:red;">*</span> </label>
          <input type="text" id="title" [(ngModel)]="notice.title" name="notice.title" class="form-control" placeholder="Tajuk" required />
          <div *ngIf="noticeForm.submitted || noticeForm.controls['notice.title']?.touched">
            <div *ngIf="noticeForm.controls['notice.title']?.errors?.['required']" class="text-danger">
              Tajuk adalah diwajibkan
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Mesej</label>
          <textarea id="message" class="form-control" [(ngModel)]="notice.message" name="notice.message" placeholder="Mesej"></textarea>
        </div>

        <div class="form-group">
          <label for="image">Muat naik</label>
          <input type="file" id="announcement" name="announcement" (change)="handleFileInput($event)" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || noticeForm.invalid">
          Hantar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
