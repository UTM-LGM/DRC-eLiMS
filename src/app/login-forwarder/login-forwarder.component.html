<body>
    <div class="background-image"></div>
    <div class="container">
      <img class="logo" src="assets/image/logoLGM.png" alt="Logo">
      <h1 class="title">DRC-eLiMS</h1>
      <form class="form1">
        <div class="input-container">
          <input class="un" type="text" placeholder="Username" name="Username" [(ngModel)]="user.username">
        </div>
        <div class="input-container">
          <input class="pass" type="password" placeholder="Password" name="Password" [(ngModel)]="user.password">
        </div>
        <a class="signin" (click)="login()">Log in</a>
        <p class="register" align="center" (click)="appComponent.loginPage = false; appComponent.registerPage = true">Register Account</p>
      </form>
    </div>
</body>
