<mat-dialog-content>Adakah anda pasti untuk padam maklumat ini ?</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Tidak</button>
  <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
  <button mat-button [mat-dialog-close]="true">Padam</button>
</mat-dialog-actions>
